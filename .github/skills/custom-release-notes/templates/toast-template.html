<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SOLUTION_NAME}} — Custom Release Notes toast</title>
<style>
  :root{
    --blue:#577CF8;
    --blue-dark:#3D5FE0;
    --ink:#1D1D1F;
    --gray:#5C5C60;
    --line:#E5E5E7;
    --off:#F8F8F8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#e8e8ea;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:28px;
  }
  .toast{
    position:relative;
    width:380px;
    max-width:92vw;
    background:#FFFFFF;
    border-radius:14px;
    box-shadow:0 24px 44px -16px rgba(0,0,0,0.30);
    padding:20px 20px 16px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .toast-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
  }
  .kicker{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11.5px;
    color:var(--blue-dark);
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .kicker .dot{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--blue);
    display:inline-block;
    flex:none;
  }
  .title{
    font-size:16.5px;
    font-weight:700;
    color:var(--ink);
    margin:0;
    line-height:1.25;
  }
  .close{
    width:24px;
    height:24px;
    border-radius:50%;
    border:none;
    background:#F1F1F3;
    color:#6b6b70;
    font-size:12px;
    line-height:1;
    cursor:pointer;
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  .items{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .item{
    display:flex;
    gap:10px;
    padding:9px 10px;
    border-radius:8px;
    background:var(--off);
  }
  .item .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--blue);
    margin-top:6px;
    flex:0 0 auto;
  }
  .item .txt strong{
    display:block;
    font-size:13.5px;
    color:var(--ink);
    font-weight:650;
    margin-bottom:2px;
    line-height:1.3;
  }
  .item .txt span{
    font-size:12.5px;
    color:var(--gray);
    line-height:1.4;
  }
  .toast-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .see-all{
    font-size:12.5px;
    color:var(--blue-dark);
    font-weight:600;
    text-decoration:none;
  }
  .btn-primary{
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:100px;
    padding:9px 18px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    flex:0 0 auto;
  }
</style>
</head>
<body>

  <div class="toast">
    <div class="toast-head">
      <div>
        <div class="kicker"><span class="dot"></span>{{KICKER_TEXT — e.g. "SINCE SEP 3" or "NEW THIS WEEK"}}</div>
        <p class="title">{{TOAST_TITLE — e.g. "New since your last visit"}}</p>
      </div>
      <button class="close" aria-label="Dismiss">&#10005;</button>
    </div>

    <div class="items">
      <!-- Exactly 2 or 3 of these. No images, no tags, no per-item dates — see references/toast-spec.md -->
      <div class="item">
        <span class="dot"></span>
        <span class="txt">
          <strong>{{ITEM_1_HEADLINE}}</strong>
          <span>{{ITEM_1_SUPPORTING_SENTENCE}}</span>
        </span>
      </div>
      <div class="item">
        <span class="dot"></span>
        <span class="txt">
          <strong>{{ITEM_2_HEADLINE}}</strong>
          <span>{{ITEM_2_SUPPORTING_SENTENCE}}</span>
        </span>
      </div>
      <!-- optional third item:
      <div class="item">
        <span class="dot"></span>
        <span class="txt">
          <strong>{{ITEM_3_HEADLINE}}</strong>
          <span>{{ITEM_3_SUPPORTING_SENTENCE}}</span>
        </span>
      </div>
      -->
    </div>

    <div class="toast-foot">
      <a class="see-all" href="{{FULL_RELEASE_NOTES_URL}}">See everything that shipped →</a>
      <button class="btn-primary">Got it</button>
    </div>
  </div>

</body>
</html>
